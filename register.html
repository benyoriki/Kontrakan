<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — Cartok</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="page-loader" class="page-loader" aria-hidden="true">
  <div class="loader-glow"></div>
  <div class="loader-mark">
    <img src="img/icon-96.png" alt="">
    <span class="loader-ring"></span>
  </div>
  <div class="loader-word">Cartok</div>
  <p class="loader-note">Prototipe Cari Kontrakan Online — website hanya contoh untuk keperluan testing. <a href="https://benyoriki.com/" target="_blank" rel="noopener">benyoriki.com</a></p>
  <div class="loader-progress-track"><div class="loader-progress-fill"></div></div>
  <div class="loader-credit">Website Developer <a href="https://benyoriki.com/" target="_blank" rel="noopener">benyoriki.com</a></div>
</div>
<noscript><style>.page-loader{display:none;}</style></noscript>


<header id="site-navbar" class="navbar"></header>

<main class="auth-wrap">
  <div class="auth-card">
    <h2>Buat Akun Baru</h2>
    <p class="mb-16">Gratis untuk pencari kontrakan maupun pemilik properti.</p>

    <div class="role-select">
      <div class="role-opt active" data-role="user" onclick="selectRole(this,'user')">🔍 Pencari Kontrakan</div>
      <div class="role-opt" data-role="owner" onclick="selectRole(this,'owner')">🏠 Pemilik Kontrakan</div>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="reg-name" required placeholder="Nama kamu">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required placeholder="nama@email.com">
      </div>
      <div class="form-group">
        <label>Nomor Telepon</label>
        <input type="tel" id="reg-phone" required placeholder="08xxxxxxxxxx">
      </div>
      <div class="form-group">
        <label>Kata Sandi</label>
        <input type="password" id="reg-password" required placeholder="Minimal 6 karakter">
        <div class="form-error" id="reg-error"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Daftar Sekarang</button>
    </form>

    <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>
</main>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  renderNavbar("");
  if(isLoggedIn()){ window.location.href = "index.html"; }

  let selectedRole = "user";
  function selectRole(el, role){
    document.querySelectorAll(".role-opt").forEach(o=>o.classList.remove("active"));
    el.classList.add("active");
    selectedRole = role;
  }

  document.getElementById("register-form").addEventListener("submit",(e)=>{
    e.preventDefault();
    const name = document.getElementById("reg-name").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const phone = document.getElementById("reg-phone").value.trim();
    const password = document.getElementById("reg-password").value;
    const errEl = document.getElementById("reg-error");
    errEl.style.display = "none";

    if(!name || !email || !phone || !password){
      errEl.textContent = "Semua field wajib diisi.";
      errEl.style.display = "block";
      return;
    }
    if(!/^\S+@\S+\.\S+$/.test(email)){
      errEl.textContent = "Format email tidak valid.";
      errEl.style.display = "block";
      return;
    }
    if(password.length < 6){
      errEl.textContent = "Kata sandi minimal 6 karakter.";
      errEl.style.display = "block";
      return;
    }

    const result = register({ name, email, password, role:selectedRole, phone });
    if(!result.ok){
      errEl.textContent = result.message;
      errEl.style.display = "block";
      toast(result.message, "error");
      return;
    }

    toast(selectedRole === "owner" ? "Akun pemilik dibuat. Ajukan properti pertamamu!" : "Akun berhasil dibuat", "success");
    setTimeout(()=>{
      window.location.href = selectedRole === "owner" ? "dashboard-owner.html" : "index.html";
    }, 600);
  });
</script>
</body>
</html>
